name: CI - Rust

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "run under chalk/curiosity; passed down by the calling workflow"
        type: boolean
        default: false
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      release:
        required: false
        type: boolean
        default: false
      branch:
        required: false
        type: string
        default: trunk
    secrets:
      SELENIUM_CI_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # A called workflow cannot read the caller's env, so the arm switch has to
  # arrive as a workflow_call input.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
          - os: ubuntu-24.04-arm
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Tests (${{ matrix.os }})
      os: ${{ matrix.os }}
      rerun-with-debug: true
      run: bazel test --test_env=RUST_BACKTRACE=full --test_env=RUST_TEST_NOCAPTURE=1 --flaky_test_attempts=3 //rust/...



  linux-stable:
    name: "Linux Stable"
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout project
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
          ref: ${{ inputs.branch }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: "Update Rust"
        run: |
          rustup update
          rustc -vV
      - name: "Install cross"
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
      - name: "Build release binary (x64)"
        run: cross build --target x86_64-unknown-linux-musl --release
        working-directory: rust
      - name: "Build release binary (arm64)"
        run: cross build --target aarch64-unknown-linux-musl --release
        working-directory: rust
      - name: "Rename binary"
        run: |
          mv rust/target/x86_64-unknown-linux-musl/release/selenium-manager selenium-manager-linux
          mv rust/target/aarch64-unknown-linux-musl/release/selenium-manager selenium-manager-linux-arm64
      - name: "Upload release binary"
        uses: actions/upload-artifact@v7
        with:
          name: selenium-manager-linux
          path: selenium-manager-linux
          retention-days: 6
      - name: "Upload release binary"
        uses: actions/upload-artifact@v7
        with:
          name: selenium-manager-linux-arm64
          path: selenium-manager-linux-arm64
          retention-days: 6

  linux-debug:
    name: "Linux Debug"
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'schedule' && github.event.repository.fork == false && (github.ref == 'refs/heads/trunk' || inputs.release)
    steps:
      - name: Checkout project
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
          ref: ${{ inputs.branch }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: "Update Rust"
        run: |
          rustup update
          rustc -vV
      - name: "Install cross"
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
      - name: "Build release binary (x64)"
        run: |
          cross build --target x86_64-unknown-linux-musl --profile dev
          cd target/x86_64-unknown-linux-musl/debug
          tar -cvf ../../../../selenium-manager-linux-debug.tar selenium-manager
        working-directory: rust
      - name: "Build release binary (arm64)"
        run: |
          cross build --target aarch64-unknown-linux-musl --profile dev
          cd target/aarch64-unknown-linux-musl/debug
          tar -cvf ../../../../selenium-manager-linux-arm64-debug.tar selenium-manager
        working-directory: rust
      - name: "Upload release binary"
        uses: actions/upload-artifact@v7
        with:
          name: selenium-manager-linux-debug
          path: selenium-manager-linux-debug.tar
          retention-days: 6
      - name: "Upload release binary"
        uses: actions/upload-artifact@v7
        with:
          name: selenium-manager-linux-arm64-debug
          path: selenium-manager-linux-arm64-debug.tar
          retention-days: 6



  sbom:
    name: "SBOM and Notices"
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'schedule' && github.event.repository.fork == false && (github.ref == 'refs/heads/trunk' || inputs.release)
    steps:
      - name: Checkout project
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
          ref: ${{ inputs.branch }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: "Update Rust"
        run: |
          rustup update
          rustc -vV
      - name: "Install SBOM tools"
        run: cargo install --locked cargo-cyclonedx@0.5.7 cargo-about@0.6.6
      - name: "Generate SBOM and third-party notices"
        working-directory: rust
        run: |
          # --target all includes target-gated crates for every platform, not just the host.
          cargo cyclonedx --format json --all-features --target all
          cargo about generate about.hbs > selenium-manager-THIRD-PARTY-NOTICES.txt
      - name: "Upload SBOM and notices"
        uses: actions/upload-artifact@v7
        with:
          name: selenium-manager-sbom
          path: |
            rust/selenium-manager.cdx.json
            rust/selenium-manager-THIRD-PARTY-NOTICES.txt
          retention-days: 6

  release:
    name: "Release Binaries"
    runs-on: ubuntu-latest
    needs: [ linux-stable, linux-debug, sbom ]
    if: github.event_name != 'schedule' && github.event.repository.fork == false && (github.ref == 'refs/heads/trunk' || inputs.release)
    steps:
      - name: "Checkout selenium_manager_artifacts"
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SELENIUM_CI_TOKEN }}
          repository: SeleniumHQ/selenium_manager_artifacts
      - name: "Download Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: "Prepare and Commit"
        run: |
          linux_sha=$(shasum -a 256 artifacts/selenium-manager-linux/selenium-manager-linux | awk '{print $1}')
          linux_arm64_sha=$(shasum -a 256 artifacts/selenium-manager-linux-arm64/selenium-manager-linux-arm64 | awk '{print $1}')
          macos_sha=$(shasum -a 256 artifacts/selenium-manager-macos/selenium-manager-macos | awk '{print $1}')
          windows_sha=$(shasum -a 256 artifacts/selenium-manager-windows/selenium-manager-windows.exe | awk '{print $1}')
          sbom_sha=$(shasum -a 256 artifacts/selenium-manager-sbom/selenium-manager.cdx.json | awk '{print $1}')
          notice_sha=$(shasum -a 256 artifacts/selenium-manager-sbom/selenium-manager-THIRD-PARTY-NOTICES.txt | awk '{print $1}')
          echo "{\"macos\": \"$macos_sha\", \"windows\": \"$windows_sha\", \"linux\": \"$linux_sha\", \"linux-arm64\": \"$linux_arm64_sha\", \"sbom\": \"$sbom_sha\", \"notice\": \"$notice_sha\"}" > latest.json
          git config --local user.email "selenium-ci@users.noreply.github.com"
          git config --local user.name "Selenium CI Bot"
          git add latest.json
          git commit -m "Update hash values for latest binaries"
          short_hash=$(git rev-parse --short HEAD)
          echo "TAG_NAME=selenium-manager-$short_hash" >> "$GITHUB_ENV"
          git tag "selenium-manager-$short_hash"
          git push && git push --tags
      - name: "Release"
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.SELENIUM_CI_TOKEN }}
          repository: SeleniumHQ/selenium_manager_artifacts
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            artifacts/selenium-manager-linux/selenium-manager-linux
            artifacts/selenium-manager-linux-arm64/selenium-manager-linux-arm64
            artifacts/selenium-manager-macos/selenium-manager-macos
            artifacts/selenium-manager-windows/selenium-manager-windows.exe
            artifacts/selenium-manager-linux-debug/selenium-manager-linux-debug.tar
            artifacts/selenium-manager-linux-arm64-debug/selenium-manager-linux-arm64-debug.tar
            artifacts/selenium-manager-macos-debug/selenium-manager-macos-debug.tar
            artifacts/selenium-manager-windows-debug/selenium-manager-windows-debug.exe
            artifacts/selenium-manager-sbom/selenium-manager.cdx.json
            artifacts/selenium-manager-sbom/selenium-manager-THIRD-PARTY-NOTICES.txt

name: CI

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

on:
  pull_request:
    paths-ignore:
      - 'docs/decisions/**'
  push:
    branches:
      - trunk
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

env:
  # The one variable that separates the arms. On baseline, action-checkout
  # skips its Set up Chalk step entirely. The github.event_name guard keeps
  # incidental push/PR runs uninstrumented, where inputs.leg is empty.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

jobs:
  build-index:
    name: Build Index
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk'
    uses: ./.github/workflows/ci-build-index.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}

  check:
    name: Check Targets
    if: >
      github.event.repository.fork == false &&
        (startsWith(github.head_ref, 'renovate/') != true || github.event_name == 'workflow_call')
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Check Targets
      cache-name: bazel-test-file-index
      run: |
        if [ "${{ github.event_name }}" == "schedule" ] || \
        [ "${{ github.event_name }}" == "workflow_call" ] || \
        [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Running all targets for ${{ github.event_name }} event"
          echo "//java/... //py/... //rb/... //dotnet/... //rust/... //javascript/..." > bazel-targets.txt
        else
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_SHA="HEAD^1"
          elif [ "${{ github.ref }}" = "refs/heads/trunk" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            ahead=$(gh api "repos/${{ github.repository }}/compare/trunk...${{ github.ref_name }}" --jq .ahead_by)
            git fetch --no-tags --depth=$((ahead + 1)) origin "${{ github.ref_name }}"
            BASE_SHA="HEAD~$ahead"
          fi
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            ./go bazel:affected_targets "${BASE_SHA}..HEAD" bazel-test-file-index
          else
            ./go bazel:affected_targets bazel-test-file-index
          fi
        fi
      artifact-name: check-targets
      artifact-path: bazel-targets.txt

  read-targets:
    name: Read Targets
    needs: check
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.read.outputs.java }}
      grid: ${{ steps.read.outputs.grid }}
      py: ${{ steps.read.outputs.py }}
      rb: ${{ steps.read.outputs.rb }}
      dotnet: ${{ steps.read.outputs.dotnet }}
      rust: ${{ steps.read.outputs.rust }}
      js: ${{ steps.read.outputs.js }}
    steps:
      - name: Download targets
        uses: actions/download-artifact@v8
        with:
          name: check-targets
      - name: Read targets
        id: read
        env:
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          targets=$(cat bazel-targets.txt 2>/dev/null || echo "")
          check_binding() {
            local pattern=$1 tag=$2
            if [[ "$targets" == *"${pattern}/"* ]] || [[ "$targets" == *"${pattern}:"* ]] || [[ "$COMMIT_MESSAGES" == *"[$tag]"* ]] || [[ "$PR_TITLE" == *"[$tag]"* ]]; then
              echo "$tag=true" >> "$GITHUB_OUTPUT"
            fi
          }
          process_binding() {
            local pattern=$1 tag=$2
            local lang_targets
            lang_targets=$(echo "$targets" | tr ' ' '\n' | awk -v p="^${pattern}[:/]" '$0 ~ p')
            if [ -n "$lang_targets" ]; then
              echo "$tag=true" >> "$GITHUB_OUTPUT"
              echo "$lang_targets" > "bazel-targets-${tag}.txt"
            fi
          }
          check_binding "//java" "java"
          check_binding "openqa/selenium/grid" "grid"
          check_binding "//dotnet" "dotnet"
          check_binding "//rust" "rust"
          check_binding "//javascript" "js"
          process_binding "//rb" "rb"
          process_binding "//py" "py"
      - name: Upload target files
        uses: actions/upload-artifact@v7
        with:
          name: targets
          path: bazel-targets-*.txt
          if-no-files-found: ignore
  dotnet:
    name: .NET
    needs: read-targets
    uses: ./.github/workflows/ci-dotnet.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
    if: needs.read-targets.outputs.dotnet != ''


  grid:
    name: Grid
    needs: read-targets
    uses: ./.github/workflows/ci-grid.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
    if: needs.read-targets.outputs.grid != ''

  python:
    name: Python
    needs: read-targets
    uses: ./.github/workflows/ci-python.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
    if: needs.read-targets.outputs.py != ''

  ruby:
    name: Ruby
    needs: read-targets
    uses: ./.github/workflows/ci-ruby.yml
    if: needs.read-targets.outputs.rb != ''
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      smoke: ${{ !(github.head_ref == 'pinned-browser-updates' && contains(github.event.pull_request.title, '(major)')) }}

  rust:
    name: Rust
    needs: read-targets
    uses: ./.github/workflows/ci-rust.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
    secrets:
      SELENIUM_CI_TOKEN: ${{ secrets.SELENIUM_CI_TOKEN }}
    if: needs.read-targets.outputs.rust != ''

  javascript:
    name: JavaScript
    needs: read-targets
    uses: ./.github/workflows/ci-javascript.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
    if: needs.read-targets.outputs.js != ''

  merge-flaky-results:
    name: Merge Flaky Results
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/trunk'
    needs: [ dotnet, grid, python, ruby, rust, javascript ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: Download results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: flaky-*
          path: build/flaky-artifacts
      - name: Merge results
        id: merge
        shell: bash
        run: ./scripts/github-actions/merge-flaky-results.sh
      - name: Upload results
        if: steps.merge.outputs.results == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: merged-flaky-results-${{ github.run_id }}
          retention-days: 60
          path: build/flaky/results.jsonl
          overwrite: true

  ci-success:
    name: CI Success
    if: always()
    needs: [ check, read-targets, dotnet, grid, python, ruby, rust, javascript ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more required jobs failed"
            exit 1
          fi

name: CI - Python

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "run under chalk/curiosity; passed down by the calling workflow"
        type: boolean
        default: false
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # A called workflow cannot read the caller's env, so the arm switch has to
  # arrive as a workflow_call input.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  build:
    name: Build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Build
      run: |
        bazel build //py:selenium-wheel //py:selenium-sdist

  lint-ruff:
    name: Lint (ruff)
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Lint (ruff)
      run: bazel run //py:ruff-check -- --no-fix

  lint-mypy:
    name: Lint (mypy)
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Lint (mypy)
      run: bazel run //py:mypy

  lint-docs:
    name: Lint (docs)
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Lint (docs)
      run: |
        bazel run //py:generate-api-listing
        bazel run //py:sphinx-autogen
        bazel build //py:docs

  unit-tests:
    name: Unit Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        os: [ubuntu]
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Unit Tests (${{ matrix.python-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      run: bazel test --local_test_jobs 1 //py:unit

  remote-tests:
    name: Remote Tests
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Integration Tests Remote
      needs-display: true
      rerun-with-debug: true
      download-artifact-name: targets
      run: >
        [ -s bazel-targets-py.txt ] || echo //py/... > bazel-targets-py.txt;
        { echo "tests(//py:test-remote) intersect set("; cat bazel-targets-py.txt; echo ")"; } > query.txt;
        bazel query --query_file=query.txt --output=label > remote-targets.txt;
        ./scripts/github-actions/bazel-test-if-targets.sh
        --keep_going
        --flaky_test_attempts 3
        --local_test_jobs 1
        --target_pattern_file=remote-targets.txt

  browser-tests:
    name: Browser Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, chrome-bidi, edge]
        os: [windows]
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Integration Tests (${{ matrix.browser }})
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      download-artifact-name: targets
      run: >
        [ -s bazel-targets-py.txt ] || echo //py/... > bazel-targets-py.txt;
        { echo "tests(//py:test-${{ matrix.browser }}) intersect set("; cat bazel-targets-py.txt; echo ")"; } > query.txt;
        bazel query --query_file=query.txt --output=label > browser-targets.txt;
        ./scripts/github-actions/bazel-test-if-targets.sh
        --keep_going
        --flaky_test_attempts 3
        --local_test_jobs 1
        --skip_incompatible_explicit_targets
        --target_pattern_file=browser-targets.txt

  selenium-manager-tests:
    name: Selenium Manager Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Integration Tests Selenium Manager (${{ matrix.os }})
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      download-artifact-name: targets
      run: >
        [ -s bazel-targets-py.txt ] || echo //py/... > bazel-targets-py.txt;
        ./scripts/github-actions/bazel-test-if-targets.sh
        --local_test_jobs 1
        --flaky_test_attempts 3
        --pin_browsers=false
        --build_tests_only
        --skip_incompatible_explicit_targets
        --test_tag_filters=se-manager
        --target_pattern_file=bazel-targets-py.txt

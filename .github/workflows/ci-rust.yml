          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  sbom:
    name: "SBOM and Notices"
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'schedule' && github.event.repository.fork == false && (github.ref == 'refs/heads/trunk' || inputs.release)
    steps:
    - name: Checkout project
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
        observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
        lfs: false
        ref: ${{ inputs.branch }}
    - name: "Update Rust"
      run: |
        rustup update
        rustc -vV
    - name: "Install SBOM tools"
      run: cargo install --locked cargo-cyclonedx@0.5.7 cargo-about@0.6.6
    - name: "Generate SBOM and third-party notices"
      working-directory: rust
      run: |
        # --target all includes target-gated crates for every platform, not just the host.
        cargo cyclonedx --format json --all-features --target all
        cargo about generate about.hbs > selenium-manager-THIRD-PARTY-NOTICES.txt
    - name: "Upload SBOM and notices"
      uses: actions/upload-artifact@v7
      with:
        name: selenium-manager-sbom
        path: |
          rust/selenium-manager.cdx.json
          rust/selenium-manager-THIRD-PARTY-NOTICES.txt
        retention-days: 6

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |

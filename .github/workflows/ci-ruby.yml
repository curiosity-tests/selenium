name: CI - Ruby

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "run under chalk/curiosity; passed down by the calling workflow"
        type: boolean
        default: false
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      smoke:
        description: Smoke tests always run; callers pass false to add the full matrix
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke tests only (default also runs the full matrix)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  # A called workflow cannot read the caller's env, so the arm switch has to
  # arrive as a workflow_call input.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Lint
      run: ./go rb:lint

  # jruby is run on RBE; minimum MRI is run by os-tests. This matrix
  # covers truffleruby and the most recent MRI release.
  unit-tests:
    name: Unit Tests
    if: github.event_name == 'schedule' || !inputs.smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: 4.0.4
            os: ubuntu
          - ruby-version: truffleruby-34.0.1
            os: ubuntu
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: Unit Tests (${{ matrix.ruby-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      ruby-version: ${{ matrix.ruby-version }}
      run: >
        bazel test
        --keep_going
        --test_size_filters small
        //rb/...

  smoke:
    name: ${{ matrix.os }}-smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      name: ${{ matrix.os }}
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      download-artifact-name: targets
      run: >
        [ -s bazel-targets-rb.txt ] || echo //rb/... > bazel-targets-rb.txt;
        ./scripts/github-actions/bazel-test-if-targets.sh
        --keep_going
        --flaky_test_attempts 2
        --local_test_jobs 1
        --skip_incompatible_explicit_targets
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_env=SKIP_PENDING=true
        --test_tag_filters=unit,os-sensitive,se-manager,skip-rbe
        --target_pattern_file=bazel-targets-rb.txt

